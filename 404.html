<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Скрипт перенаправления для Single Page Application на GitHub Pages
        const segment = 1; // Измените на 2, если ваш репозиторий называется не 'games', а что-то другое, и лежит в корне organization
        const path = window.location.pathname;
        const repo = path.split('/').slice(0, segment + 1).join('/');
        const redirectTo = repo + '/?' + path.substring(repo.length);
        window.location.replace(redirectTo);
    </script>
</head>
<body>
Redirecting to the application...
</body>
</html>
